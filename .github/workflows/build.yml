          package it.sentiero.tracker

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.os.Build
          import android.os.Bundle
          import android.os.IBinder
          import android.os.PowerManager

          class TrackService : Service(), LocationListener {

              private var lm: LocationManager? = null
              private var wl: PowerManager.WakeLock? = null
              private var count = 0

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("rec", "Registrazione percorso", NotificationManager.IMPORTANCE_LOW)
                  )
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = Notification.Builder(this, "rec")
                      .setContentTitle("Xplor3")
                      .setContentText("Registrazione del percorso in corso")
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION)
                  } else {
                      startForeground(1, n)
                  }
                  if (wl == null) {
                      val pm = getSystemService(PowerManager::class.java)
                      val w = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "xplor3:rec")
                      w.acquire(12 * 60 * 60 * 1000L)
                      wl = w
                  }
                  val m = getSystemService(LocationManager::class.java)
                  lm = m
                  try {
                      m.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000L, 2f, this)
                  } catch (e: SecurityException) {
                      stopSelf()
                  }
                  return START_NOT_STICKY
              }

              override fun onLocationChanged(l: Location) {
                  if (l.hasAccuracy() && l.accuracy > 40f) return
                  TrackStore.add(l)
                  count++
                  if (count % 20 == 0) {
                      try {
                          TrackStore.save(filesDir)
                      } catch (e: Exception) {
                      }
                  }
              }

              override fun onProviderEnabled(provider: String) {}

              override fun onProviderDisabled(provider: String) {}

              @Deprecated("Deprecated in Java")
              override fun onStatusChanged(provider: String?, status: Int, extras: Bundle?) {}

              override fun onDestroy() {
                  lm?.removeUpdates(this)
                  try {
                      wl?.release()
                  } catch (e: Exception) {
                  }
                  TrackStore.finish()
                  TrackStore.save(filesDir)
                  TrackStore.listener?.invoke()
                  super.onDestroy()
              }
          }

          package it.sentiero.tracker

          import android.location.Location
          import android.util.Xml
          import org.xmlpull.v1.XmlPullParser
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Locale
          import java.util.TimeZone

          class TrackData(val lat: DoubleArray, val lon: DoubleArray, ele: DoubleArray, val time: LongArray) {
              val n: Int = lat.size
              val dist = DoubleArray(n)
              val alt = DoubleArray(n)
              val speed = DoubleArray(n)
              var hasEle = false
              var ascent = 0.0
              var descent = 0.0
              var minAlt = 0.0
              var maxAlt = 0.0
              var maxSpeed = 0.0
              var duration = 0L
              var moving = 0.0

              val total: Double
                  get() = dist[n - 1]

              init {
                  val r = FloatArray(1)
                  for (i in 1 until n) {
                      Location.distanceBetween(lat[i - 1], lon[i - 1], lat[i], lon[i], r)
                      dist[i] = dist[i - 1] + r[0].toDouble()
                  }
                  var any = false
                  for (v in ele) {
                      if (!v.isNaN()) any = true
                  }
                  hasEle = any
                  if (any) {
                      val filled = DoubleArray(n)
                      var last = Double.NaN
                      for (i in 0 until n) {
                          if (!ele[i].isNaN()) last = ele[i]
                          filled[i] = last
                      }
                      var first = 0.0
                      for (i in 0 until n) {
                          if (!filled[i].isNaN()) {
                              first = filled[i]
                              break
                          }
                      }
                      for (i in 0 until n) {
                          if (filled[i].isNaN()) filled[i] = first
                      }
                      for (i in 0 until n) {
                          val a = maxOf(0, i - 2)
                          val b = minOf(n - 1, i + 2)
                          var s = 0.0
                          for (j in a..b) s += filled[j]
                          alt[i] = s / (b - a + 1)
                      }
                      minAlt = alt[0]
                      maxAlt = alt[0]
                      var ref = alt[0]
                      for (i in 0 until n) {
                          if (alt[i] < minAlt) minAlt = alt[i]
                          if (alt[i] > maxAlt) maxAlt = alt[i]
                          val d = alt[i] - ref
                          if (d >= 3.0) {
                              ascent += d
                              ref = alt[i]
                          } else if (d <= -3.0) {
                              descent -= d
                              ref = alt[i]
                          }
                      }
                  }
                  for (i in 0 until n) {
                      val a = maxOf(0, i - 3)
                      val b = minOf(n - 1, i + 3)
                      val dt = (time[b] - time[a]) / 1000.0
                      speed[i] = if (dt > 0.5) (dist[b] - dist[a]) / dt * 3.6 else 0.0
                      if (speed[i] > maxSpeed) maxSpeed = speed[i]
                  }
                  duration = (time[n - 1] - time[0]) / 1000
                  for (i in 1 until n) {
                      val dt = (time[i] - time[i - 1]) / 1000.0
                      if (dt > 0.0 && dt < 60.0) {
                          val v = (dist[i] - dist[i - 1]) / dt * 3.6
                          if (v > 1.0) moving += dt
                      }
                  }
              }

              fun slopeAt(i: Int): Double {
                  if (!hasEle) return 0.0
                  val a = maxOf(0, i - 4)
                  val b = minOf(n - 1, i + 4)
                  val d = dist[b] - dist[a]
                  return if (d > 5.0) (alt[b] - alt[a]) / d * 100.0 else 0.0
              }
          }

          object GpxReader {
              fun read(f: File): TrackData? {
                  val la = ArrayList<Double>()
                  val lo = ArrayList<Double>()
                  val el = ArrayList<Double>()
                  val tm = ArrayList<Long>()
                  val fmt = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", Locale.US)
                  fmt.timeZone = TimeZone.getTimeZone("UTC")
                  val parser = Xml.newPullParser()
                  val stream = f.inputStream()
                  try {
                      parser.setInput(stream, "UTF-8")
                      var curLat = 0.0
                      var curLon = 0.0
                      var curEle = Double.NaN
                      var curTime = 0L
                      var inPt = false
                      var tag = ""
                      var ev = parser.eventType
                      while (ev != XmlPullParser.END_DOCUMENT) {
                          if (ev == XmlPullParser.START_TAG) {
                              tag = parser.name
                              if (tag == "trkpt") {
                                  inPt = true
                                  curLat = parser.getAttributeValue(null, "lat")?.toDoubleOrNull() ?: 0.0
                                  curLon = parser.getAttributeValue(null, "lon")?.toDoubleOrNull() ?: 0.0
                                  curEle = Double.NaN
                                  curTime = 0L
                              }
                          } else if (ev == XmlPullParser.TEXT) {
                              if (inPt) {
                                  val t = parser.text.trim()
                                  if (tag == "ele") {
                                      curEle = t.toDoubleOrNull() ?: Double.NaN
                                  } else if (tag == "time") {
                                      try {
                                          curTime = fmt.parse(t)?.time ?: 0L
                                      } catch (e: Exception) {
                                          curTime = 0L
                                      }
                                  }
                              }
                          } else if (ev == XmlPullParser.END_TAG) {
                              if (parser.name == "trkpt") {
                                  la.add(curLat)
                                  lo.add(curLon)
                                  el.add(curEle)
                                  tm.add(curTime)
                                  inPt = false
                              }
                              tag = ""
                          }
                          ev = parser.next()
                      }
                  } catch (e: Exception) {
                      return null
                  } finally {
                      stream.close()
                  }
                  if (la.size < 2) return null
                  return TrackData(la.toDoubleArray(), lo.toDoubleArray(), el.toDoubleArray(), tm.toLongArray())
              }
          }
